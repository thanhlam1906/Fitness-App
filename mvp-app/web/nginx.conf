# Cửa vào production (doc/design-trien-khai-v1.md §4): phát trang web đã build, chuyển /api sang backend.
# Chỉ cloudflared gọi tới qua mạng Docker; cổng duy nhất mở ra máy là 127.0.0.1:8088 cho chạy thử và
# cho bước kiểm của CD (bẫy 0.2, 2.2). File này nằm trong khối http của nginx.

# DNS nội bộ của Docker. Tên "backend" được hỏi lại mỗi 10 giây: backend bị tạo lại mang IP mới thì
# nginx vẫn tìm ra, không trả 502 tới lúc nginx khởi động lại (bẫy 1.14).
resolver 127.0.0.11 valid=10s;

upstream backend {
    zone backend 64k;
    server backend:8080 resolve;
}

server {
    listen 80;
    server_tokens off;

    # IP thật của người dùng: Cloudflare ghi vào CF-Connecting-IP. Chỉ tin header này khi kết nối tới từ
    # mạng edge của compose (subnet ghim trong docker-compose.prod.yml), nơi chỉ có cloudflared và web (bẫy 1.4).
    set_real_ip_from 10.89.1.0/24;
    real_ip_header CF-Connecting-IP;

    # Cloudflare chặn request trên 100 MB. Web chặn tổng clip 95 MB, backend nhận tối đa 96MB (bẫy 1.5).
    client_max_body_size 96m;

    root /usr/share/nginx/html;

    location /api/ {
        proxy_pass http://backend;
        # GHI ĐÈ, không nối thêm: Tomcat tin X-Forwarded-For khi request tới từ mạng nội bộ. Nối thêm thì
        # người ngoài tự gửi header giả là lách được giới hạn đăng nhập, đăng ký theo IP (state-env 10-13).
        proxy_set_header X-Forwarded-For $remote_addr;
        # Nạp tài liệu vào trợ lý gọi embedding nhiều lô liền, trợ lý gọi OpenAI nhiều vòng: mặc định 60 s cắt
        # giữa chừng trong khi backend vẫn chạy xong và ghi DB. 100 s khớp mức Cloudflare tự cắt (lỗi 524).
        proxy_read_timeout 100s;
    }

    # Actuator chỉ dành cho mạng nội bộ (Prometheus ở giai đoạn 6), không cho ra ngoài (spec §4, bẫy 1.7).
    location /actuator {
        return 404;
    }

    # File có mã băm trong tên: đổi nội dung là đổi tên, nên cache một năm được. Thiếu file thì 404, không
    # trả index.html: trang cũ còn mở xin file JS đã bị bản mới xoá sẽ cache HTML dưới tên file JS (bẫy 1.6).
    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Đường của React Router (/schedule…) không có file thật nên trả index.html. Không cache để tải lại
    # trang là thấy bản mới ngay sau deploy (bẫy 1.6).
    location / {
        try_files $uri /index.html;
        add_header Cache-Control "no-cache";
    }
}
