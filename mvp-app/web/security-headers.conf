# Header bảo mật cho trang web và file tĩnh. Location nào có add_header riêng thì nginx bỏ hết add_header
# của cấp server, nên file này được include trong từng location của nginx.conf. /api/ không cần: Spring tự gửi.
# "always" để có cả trên trang 404.

# Chặn trang khác nhúng app vào iframe rồi lừa người dùng bấm (clickjacking), như nút Khoá người dùng của admin.
add_header X-Frame-Options "DENY" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
# Chỉ trang của chính app được xin camera (chấm form trực tiếp). App không dùng micro, vị trí.
add_header Permissions-Policy "camera=(self), microphone=(), geolocation=()" always;

# CSP đang ở chế độ chỉ báo: vi phạm hiện trong console, chưa chặn gì. Chạy vài ngày, mở thử Đăng nhập, Lịch,
# chấm form trực tiếp, xem trước clip, ảnh bài tập của admin; console sạch thì đổi tên header thành
# Content-Security-Policy. Vì sao có từng nguồn: jsdelivr là thẻ script loader wasm MediaPipe tự chèn và file wasm;
# wasm-unsafe-eval để dịch wasm; blob: là wasm, model đưa cho MediaPipe qua URL blob, và clip, ảnh xem trước khi
# gửi; googleapis là model pose; hai tên fonts là Google Fonts trong index.html.
add_header Content-Security-Policy-Report-Only "default-src 'self'; script-src 'self' https://cdn.jsdelivr.net 'wasm-unsafe-eval'; style-src 'self' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' blob:; media-src 'self' blob:; connect-src 'self' blob: https://cdn.jsdelivr.net https://storage.googleapis.com; object-src 'none'; base-uri 'none'; form-action 'self'; frame-ancestors 'none'" always;
