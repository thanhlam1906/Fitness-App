# Prometheus của production (profile monitoring trong docker-compose.prod.yml, doc/design-trien-khai-v1.md §4).
# Gọi trong mạng Docker nội bộ, không qua nginx: nginx chặn /actuator từ ngoài.
global:
  scrape_interval: 15s

scrape_configs:
  # Backend sập (container dừng, tên "backend" không còn) thì up{job="backend"} = 0: Grafana báo theo số này.
  - job_name: backend
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["backend:8080"]

  # CPU, RAM, ổ của máy chủ, và mốc backup cuối (file textfile do backup.sh ghi, bẫy 5.6).
  - job_name: may
    static_configs:
      - targets: ["node-exporter:9100"]
