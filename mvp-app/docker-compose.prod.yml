# Bộ production (doc/design-trien-khai-v1.md §4): cùng một file cho vps-staging, vps-gia và VPS thật, chỉ
# khác nhau ở file .env cạnh nó (quyền 600). Trên máy: /opt/vfit/docker-compose.prod.yml + /opt/vfit/.env.
# Chạy thử ở laptop (không bật cloudflared):
#   docker compose -f mvp-app/docker-compose.prod.yml --env-file mvp-app/prod-thu.env up -d --wait web analyzer
# Tên project riêng "vfit": không đụng stack dev "fitnessapp" và volume Postgres dev.
name: vfit

services:
  postgres:
    image: pgvector/pgvector:0.8.6-pg16
    environment:
      POSTGRES_DB: fitness
      POSTGRES_USER: fitness
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Thiếu DB_PASSWORD trong .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fitness -d fitness"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped
    mem_limit: 512m

  backend:
    image: ghcr.io/thanhlam1906/vfit-backend:${IMAGE_TAG:?Thiếu IMAGE_TAG trong .env}
    environment:
      SPRING_PROFILES_ACTIVE: prod
      DB_URL: jdbc:postgresql://postgres:5432/fitness
      DB_PASSWORD: ${DB_PASSWORD:?Thiếu DB_PASSWORD trong .env}
      JWT_SECRET: ${JWT_SECRET:?Thiếu JWT_SECRET trong .env}
      OPENAI_API_KEY: ${OPENAI_API_KEY:?Thiếu OPENAI_API_KEY trong .env}
      CLIP_STORAGE_PATH: /data
    volumes:
      # Thư mục clip dùng chung với analyzer: backend ghi, analyzer đọc rồi xoá ngay sau khi chấm.
      - clips:/data
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      # Spring Boot cần vài chục giây để lên (lần đầu còn chạy Flyway): chưa tính là hỏng trong lúc này.
      start_period: 180s
      start_interval: 5s
    restart: unless-stopped
    # Heap = 65% số này (ENTRYPOINT trong backend/Dockerfile), khoảng 500 MB (bẫy 1.2).
    mem_limit: 768m

  # Không mở cổng, không gọi backend: chỉ nói chuyện qua Postgres và thư mục clip (bất biến sản phẩm).
  analyzer:
    image: ghcr.io/thanhlam1906/vfit-analyzer:${IMAGE_TAG:?Thiếu IMAGE_TAG trong .env}
    environment:
      # Mật khẩu không nằm trong URI: ký tự như / @ : làm hỏng URI. libpq tự lấy PGPASSWORD (bẫy 1.12).
      DB_URL: postgresql://fitness@postgres:5432/fitness
      PGPASSWORD: ${DB_PASSWORD:?Thiếu DB_PASSWORD trong .env}
      CLIP_STORAGE_PATH: /data
      # Màn camera chờ kết quả ngay trên màn hình: poll 1 s thay vì 5 s mặc định.
      POLL_INTERVAL_SEC: "1"
    volumes:
      - clips:/data
    depends_on:
      # Chờ backend chứ không chỉ postgres: bảng do Flyway trong backend tạo (bẫy 1.9).
      backend:
        condition: service_healthy
    # Nhận tín hiệu dừng thì chấm xong job đang dở rồi mới thoát; deploy không cắt ngang một lượt chấm.
    stop_grace_period: 60s
    restart: unless-stopped
    mem_limit: 768m

  web:
    image: ghcr.io/thanhlam1906/vfit-web:${IMAGE_TAG:?Thiếu IMAGE_TAG trong .env}
    # Web là cửa duy nhất nối hai mạng: nhận từ cloudflared ở edge, gọi backend ở default.
    networks: [default, edge]
    ports:
      # Chỉ chính máy này mở được (bẫy 0.2): để chạy thử ở laptop và để CD kiểm qua SSH (bẫy 2.2).
      # Người ngoài vào qua Cloudflare Tunnel, không qua cổng này.
      - "127.0.0.1:8088:80"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/"]
      interval: 10s
      timeout: 3s
      retries: 3
    restart: unless-stopped
    # nginx ghi tạm cả lần gửi video (tới 95 MB) ra file, cache của file đó tính vào trần này.
    # 64m chạm trần và bị hãm mạng ngay ở 2 lần gửi thật (bẫy 2.9).
    mem_limit: 256m

  # Đường hầm ra internet (giai đoạn 2). Token chỉ ở .env, truyền bằng biến, không lên dòng lệnh (bẫy 2.1).
  cloudflared:
    image: cloudflare/cloudflared:2026.10.1
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: ${TUNNEL_TOKEN:-}
    # Chỉ ở mạng edge: đường đi của tunnel cấu hình trên trang Cloudflare, lỡ trỏ nhầm (hay bị sửa) sang
    # backend:8080 hoặc postgres:5432 thì cũng không tới được, mọi thứ phải đi qua nginx.
    networks: [edge]
    depends_on:
      - web
    restart: unless-stopped
    mem_limit: 128m

  # ---- Giám sát, CHỈ production (giai đoạn 6, spec §3): bật bằng dòng COMPOSE_PROFILES=monitoring trong
  # /opt/vfit/.env của máy production. Staging không có dòng đó nên không chạy, tiết kiệm RAM.
  # Biến trong profile này viết ${X:-}, không ${X:?}: compose kiểm biến của MỌI service kể cả profile không bật,
  # dùng :? thì staging (không có các biến này) hỏng hết (thử 10-28). Grafana tự kiểm ở entrypoint bên dưới.
  # Không service nào mở cổng ra ngoài (bẫy 6.2): Docker đi vòng ufw, nên chỉ Grafana bind 127.0.0.1.

  prometheus:
    image: prom/prometheus:v3.13.5
    profiles: [monitoring]
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      # Giữ 15 ngày (bẫy 6.3), và chặn trên 2 GB phòng số đo phình bất thường.
      - --storage.tsdb.retention.time=15d
      - --storage.tsdb.retention.size=2GB
    volumes:
      - ./giam-sat/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus:/prometheus
    restart: unless-stopped
    mem_limit: 384m

  # Đọc CPU, RAM, ổ của máy chủ qua /proc, /sys, / gắn chỉ đọc. Ở mạng Docker nội bộ (không network_mode: host)
  # nên cổng 9100 không ra ngoài; đổi lại không đo được mạng của máy, ba bảng không cần số đó.
  node-exporter:
    image: prom/node-exporter:v1.12.1
    profiles: [monitoring]
    command:
      - --path.procfs=/host/proc
      - --path.sysfs=/host/sys
      - --path.rootfs=/host/root
      # backup.sh ghi giờ lần backup thành công vào đây; Grafana báo khi cũ hơn 26 giờ (bẫy 5.6).
      - --collector.textfile.directory=/textfile
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/host/root:ro,rslave
      - ./textfile:/textfile:ro
    restart: unless-stopped
    mem_limit: 64m

  # Xem từ laptop qua đường hầm SSH: ssh -L 3000:127.0.0.1:3000 deploy@vps-gia rồi mở http://localhost:3000.
  # Không bind IP Tailscale: chính sách Tailscale chỉ cho cổng 22 vào tag:server (bẫy 0.6).
  grafana:
    image: grafana/grafana:13.2.4
    profiles: [monitoring]
    # Thiếu bí mật thì dừng, không chạy: thiếu mật khẩu admin thì Grafana tự đặt admin/admin (bẫy 6.1), thiếu
    # mật khẩu Gmail thì cảnh báo lặng lẽ không gửi được. Container chết lặp làm deploy.sh báo đỏ (bẫy 4.12).
    entrypoint:
      - sh
      - -c
      - >-
        [ -n "$$GF_SECURITY_ADMIN_PASSWORD" ] && [ -n "$$GF_SMTP_PASSWORD" ] && [ -n "$$ALERT_EMAIL" ]
        && [ -n "$$GRAFANA_DB_PASSWORD" ]
        || { echo "Thiếu GRAFANA_ADMIN_PASSWORD, GMAIL_APP_PASSWORD, ALERT_EMAIL hoặc GRAFANA_DB_PASSWORD trong .env"; exit 1; };
        exec /run.sh
    environment:
      # Chỉ có tác dụng lần chạy đầu (volume grafana còn trống); đổi sau đó phải đổi trong Grafana.
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      # Gmail: cổng 587 + STARTTLS bắt buộc, đăng nhập bằng "mật khẩu ứng dụng" Google (không phải mật khẩu Gmail).
      GF_SMTP_ENABLED: "true"
      GF_SMTP_HOST: smtp.gmail.com:587
      GF_SMTP_STARTTLS_POLICY: MandatoryStartTLS
      GF_SMTP_USER: ${ALERT_EMAIL:-}
      GF_SMTP_PASSWORD: ${GMAIL_APP_PASSWORD:-}
      GF_SMTP_FROM_ADDRESS: ${ALERT_EMAIL:-}
      GF_SMTP_FROM_NAME: vfit Grafana
      # Đọc trong giam-sat/grafana/provisioning (người nhận cảnh báo, mật khẩu role Postgres chỉ đọc).
      ALERT_EMAIL: ${ALERT_EMAIL:-}
      GRAFANA_DB_PASSWORD: ${GRAFANA_DB_PASSWORD:-}
    volumes:
      - ./giam-sat/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./giam-sat/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana:/var/lib/grafana
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      - prometheus
    restart: unless-stopped
    mem_limit: 256m

networks:
  default:
    ipam:
      config:
        - subnet: 10.89.0.0/24
  edge:
    ipam:
      config:
        # Ghim dải mạng: nginx chỉ tin CF-Connecting-IP từ dải này (set_real_ip_from trong web/nginx.conf).
        - subnet: 10.89.1.0/24

volumes:
  pgdata:
  clips:
  prometheus:
  grafana:
