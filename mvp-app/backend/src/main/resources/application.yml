spring:
  application:
    name: fitness-backend
  datasource:
    # 15432 khớp docker-compose.yml — máy dev có postgres.exe khác chiếm sẵn 5432
    url: ${DB_URL:jdbc:postgresql://localhost:15432/fitness}
    username: ${DB_USER:fitness}
    password: ${DB_PASSWORD:fitness_dev_only}
  flyway:
    enabled: true
    locations: classpath:db/migration
  jpa:
    open-in-view: false
    hibernate:
      # Flyway là nguồn sự thật duy nhất của schema. JPA không bao giờ
      # tự tạo/sửa bảng — validate chỉ kiểm entity có khớp schema đã có.
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  servlet:
    multipart:
      # Clip TN2: vài rep, ~10–20 MB mỗi clip, tối đa 3 clip mỗi lần gửi.
      max-file-size: 60MB
      max-request-size: 200MB
  # RestClient của Boot, Spring AI OpenAI dùng chính builder này. Mặc định không giới hạn thời gian đọc:
  # OpenAI treo là luồng treo theo. gpt-4o-mini trả lời ngắn thường dưới 10 giây.
  http:
    client:
      connect-timeout: 5s
      read-timeout: 20s

  ai:
    model:
      # Chỉ bật chat + embedding — Spring AI starter mặc định tự cấu hình cả
      # audio/image/moderation, mỗi cái đòi hỏi api-key riêng lúc khởi động dù
      # không dùng. embedding: bậc 2 trợ lý, concept-chatbot-v1.md §5.2.
      chat: openai
      embedding: openai
      image: none
      moderation: none
      audio:
        speech: none
        transcription: none
    openai:
      # Placeholder để context load được khi chưa set (test, dev chưa cần gọi
      # thật) — cùng kiểu JWT_SECRET ở dưới. Gọi thật thì PHẢI set OPENAI_API_KEY.
      api-key: ${OPENAI_API_KEY:sk-dev-placeholder-not-a-real-key}
      chat:
        options:
          model: ${OPENAI_CHAT_MODEL:gpt-4o-mini}
      embedding:
        options:
          model: text-embedding-3-small
          dimensions: 512
    # doc/design-chiu-loi-v1.md §4.2. Mặc định Spring AI 1.1.8: thử 10 lần, chờ 2s ×5 tới trần 3 phút
    # (~19 phút một câu), giữ luồng Tomcat suốt thời gian đó. 2 lần, chờ 1s là đủ cho lỗi thoáng qua.
    retry:
      max-attempts: 2
      backoff:
        initial-interval: 1s
        multiplier: 2
        max-interval: 2s

server:
  port: ${SERVER_PORT:8080}
  # Sau Caddy, getRemoteAddr() là IP của Caddy: rate limit theo IP sẽ chặn chung mọi người. "native" bật
  # RemoteIpValve của Tomcat, chỉ tin X-Forwarded-For khi request tới từ dải nội bộ (mạng Docker,
  # 10.x/172.16–31.x/192.168.x/127.x), nên người ngoài gửi header giả không có tác dụng.
  forward-headers-strategy: native
  error:
    # Admin editor cần thấy lý do lỗi thật (vd "thresholds không phải JSON hợp lệ") — mặc định
    # Spring ẩn message, chỉ trả {status, error, path}. API nội bộ, không expose ra người dùng cuối.
    include-message: always

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      # bật chi tiết (gồm trạng thái DB) khi gọi có xác thực — an toàn hơn "always"
      show-details: when-authorized
  health:
    # Breaker hiện trong health nhưng không làm backend DOWN (allow-health-indicator-to-fail bên dưới).
    circuitbreakers:
      enabled: true

app:
  # concept-backend-v1.md §9: tối thiểu 32 byte. Default chỉ để dev local chạy được
  # ngay không cần set env — cùng kiểu với DB_PASSWORD ở trên. KHÔNG dùng default này
  # ở môi trường thật, luôn set JWT_SECRET.
  jwt-secret: ${JWT_SECRET:dev-only-jwt-secret-not-for-production-32b}

  # concept-backend-v1.md §8: GỐC của kho clip, analyzer mount chung đúng thư
  # mục này. storage_key đã mang sẵn tiền tố "clips/" (V1__init.sql), nên đây là
  # thư mục cha — trỏ vào ".../clips" sẽ ra đường dẫn clips/clips/.
  # Deploy thì đổi ClipStorage sang MinIO/S3, sửa đúng một class.
  clip-storage-path: ${CLIP_STORAGE_PATH:./var}

  # §6.2 ke-hoach-chi-tiet-chuc-nang-v1.md — giới hạn lượt gửi clip mỗi 7 ngày.
  # Q8 của đặc tả còn treo (PM chốt khi biết chi phí xử lý thật), để ở config
  # nên đổi không cần sửa code.
  review-weekly-limit: ${REVIEW_WEEKLY_LIMIT:10}

  # Máy trích PDF chế độ hybrid (doc/design-nap-tai-lieu-v1.md §6). Backend chạy ngoài Docker gọi
  # cổng 5002 mở ra host; trong compose đặt PDF_HYBRID_URL=http://pdf-hybrid:5002.
  pdf-hybrid-url: ${PDF_HYBRID_URL:http://localhost:5002}
  # Giới hạn mỗi lần gọi server hybrid (một lần tối đa 50 trang). Đo 10-02 trên CPU: trang khó
  # 17–50 s, lô 50 trang của sách 288 trang mất ~27 phút → 60 phút còn dư.
  pdf-hybrid-timeout: ${PDF_HYBRID_TIMEOUT:PT60M}

# doc/design-chiu-loi-v1.md §5. Đếm MỌI lần gọi (cả đúng mật khẩu): người thật không đăng nhập 5 lần một phút.
resilience4j:
  ratelimiter:
    # Mỗi khoá (email + IP, IP, người dùng) là một bộ đếm riêng; metrics thêm 2 gauge gắn tên khoá cho từng bộ.
    # Bị gửi email bịa thì RAM phình nhanh gấp ~3 lần và email lộ vào metrics. Breaker, bulkhead giữ metrics.
    metrics:
      enabled: false
    configs:
      login:
        limit-for-period: 5
        limit-refresh-period: 1m
        timeout-duration: 0
      register:
        limit-for-period: 30
        limit-refresh-period: 1h
        timeout-duration: 0
      assistant:
        limit-for-period: 10
        limit-refresh-period: 1m
        timeout-duration: 0
  circuitbreaker:
    instances:
      # Chung cho chat và embedding: cùng nhà cung cấp, cùng sập (doc/design-chiu-loi-v1.md §4.2).
      openai:
        sliding-window-type: COUNT_BASED
        sliding-window-size: 10
        # Mặc định 100: ít người dùng thì breaker không bao giờ đủ số lần gọi để mở.
        minimum-number-of-calls: 5
        failure-rate-threshold: 50
        # Gọi chậm cũng tính: đây là phần "giới hạn thời gian" ở mức dịch vụ, không đổi luồng như TimeLimiter.
        slow-call-duration-threshold: 15s
        slow-call-rate-threshold: 50
        wait-duration-in-open-state: 30s
        permitted-number-of-calls-in-half-open-state: 2
        register-health-indicator: true
        # OpenAI sập mà health DOWN thì hệ thống báo sập khởi động lại backend vô ích.
        allow-health-indicator-to-fail: false
  bulkhead:
    instances:
      # Tomcat có 200 luồng: OpenAI treo thì tối đa 20 luồng kẹt ở trợ lý, còn 180 cho đăng nhập, Lịch.
      # Chờ 0: đầy thì báo bận ngay, không xếp hàng giữ thêm luồng.
      assistant:
        max-concurrent-calls: 20
        max-wait-duration: 0
