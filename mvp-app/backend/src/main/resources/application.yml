spring:
  application:
    name: fitness-backend
  datasource:
    # 55432 khớp docker-compose.yml — máy dev có postgres.exe khác chiếm sẵn 5432
    url: ${DB_URL:jdbc:postgresql://localhost:55432/fitness}
    username: ${DB_USER:fitness}
    password: ${DB_PASSWORD:fitness_dev_only}
  flyway:
    enabled: true
    locations: classpath:db/migration
  jpa:
    open-in-view: false
    hibernate:
      # Flyway là nguồn sự thật duy nhất của schema. JPA không bao giờ
      # tự tạo/sửa bảng — validate chỉ kiểm entity có khớp schema đã có.
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  servlet:
    multipart:
      # Clip TN2: vài rep, ~10–20 MB mỗi clip, tối đa 3 clip mỗi lần gửi.
      max-file-size: 60MB
      max-request-size: 200MB

  ai:
    model:
      # Chỉ bật chat — Spring AI starter mặc định tự cấu hình cả audio/image/
      # moderation, mỗi cái đòi hỏi api-key riêng lúc khởi động dù không dùng.
      chat: openai
      embedding: none
      image: none
      moderation: none
      audio:
        speech: none
        transcription: none
    openai:
      # Placeholder để context load được khi chưa set (test, dev chưa cần gọi
      # thật) — cùng kiểu JWT_SECRET ở dưới. Gọi thật thì PHẢI set OPENAI_API_KEY.
      api-key: ${OPENAI_API_KEY:sk-dev-placeholder-not-a-real-key}
      chat:
        options:
          model: ${OPENAI_CHAT_MODEL:gpt-4o-mini}

server:
  port: ${SERVER_PORT:8080}
  error:
    # Admin editor cần thấy lý do lỗi thật (vd "thresholds không phải JSON hợp lệ") — mặc định
    # Spring ẩn message, chỉ trả {status, error, path}. API nội bộ, không expose ra người dùng cuối.
    include-message: always

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      # bật chi tiết (gồm trạng thái DB) khi gọi có xác thực — an toàn hơn "always"
      show-details: when-authorized

app:
  # concept-backend-v1.md §9: tối thiểu 32 byte. Default chỉ để dev local chạy được
  # ngay không cần set env — cùng kiểu với DB_PASSWORD ở trên. KHÔNG dùng default này
  # ở môi trường thật, luôn set JWT_SECRET.
  jwt-secret: ${JWT_SECRET:dev-only-jwt-secret-not-for-production-32b}

  # concept-backend-v1.md §8: GỐC của kho clip, analyzer mount chung đúng thư
  # mục này. storage_key đã mang sẵn tiền tố "clips/" (V1__init.sql), nên đây là
  # thư mục cha — trỏ vào ".../clips" sẽ ra đường dẫn clips/clips/.
  # Deploy thì đổi ClipStorage sang MinIO/S3, sửa đúng một class.
  clip-storage-path: ${CLIP_STORAGE_PATH:./var}

  # §6.2 ke-hoach-chi-tiet-chuc-nang-v1.md — giới hạn lượt gửi clip mỗi 7 ngày.
  # Q8 của đặc tả còn treo (PM chốt khi biết chi phí xử lý thật), để ở config
  # nên đổi không cần sửa code.
  review-weekly-limit: ${REVIEW_WEEKLY_LIMIT:10}

  # Kho kiến thức trợ lý: *.md do Docling sinh (concept-chatbot-v1.md §7). Trong
  # container backend mount ./backend:/app nên đường dẫn tương đối này vẫn đúng.
  corpus-path: ${CORPUS_PATH:./content/corpus}
